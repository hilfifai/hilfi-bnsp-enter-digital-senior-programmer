host: localhost:9000
info:
  contact: {}
  description: API documentations for the BE.
  title: General API
  version: "1.0"
paths:
  /api/v1/auth/data:
    get:
      consumes:
      - application/json
      description: Get User Info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ResponseAPI'
      security:
      - BearerAuth: []
      summary: User Info
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Get Access token
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ResponseAPI'
      summary: Auth
      tags:
      - Auth
  /api/v1/auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Get Refresh token
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ResponseAPI'
      summary: Refresh Token
      tags:
      - Auth
  /api/v1/customers:
    get:
      description: Get all customers with optional active filter
      parameters:
      - description: Filter active only
        in: query
        name: active_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.ResponseAPI'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/types.ResponseAPI'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ResponseAPI'
      security:
      - BearerAuth: []
      summary: Get all customers
      tags:
      - Customer
    post:
      consumes:
      - application/json
      description: Create a new customer
      parameters:
      - description: Customer data
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCustomerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/types.ResponseAPI'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ResponseAPI'
        "401":
